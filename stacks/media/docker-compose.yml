networks:
  media_net:
    driver: overlay
services:
  prowlarr:
    image: "lscr.io/linuxserver/prowlarr:latest"
    deploy:
      replicas: 1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - "./config/prowlarr:/config"
    ports:
      - "9696:9696"
    networks:
      - media_net
  sonarr:
    image: "lscr.io/linuxserver/sonarr:latest"
    deploy:
      replicas: 1
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - "./config/sonarr:/config"
      - "./downloads:/downloads"
    ports:
      - "8989:8989"
    networks:
      - media_net
  radarr:
    image: "lscr.io/linuxserver/radarr:latest"
    deploy:
      replicas: 1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - "./config/radarr:/config"
      - "./downloads:/downloads"
    ports:
      - "7878:7878"
    networks:
      - media_net
  qbittorrent:
    image: "lscr.io/linuxserver/qbittorrent:latest"
    deploy:
      replicas: 1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080
    volumes:
      - "./config/qbittorrent:/config"
      - "./downloads:/downloads"
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    networks:
      - media_net
  jellyfin:
    image: "lscr.io/linuxserver/jellyfin:latest"
    deploy:
      replicas: 1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - "./config/jellyfin:/config"
      - "./downloads:/data"
    ports:
      - "8096:8096"
    networks:
      - media_net
