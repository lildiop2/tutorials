services:
  # =====================================================
  # PORTAINER
  # =====================================================
  portainer:
    image: portainer/portainer-ce:latest
    networks:
      - public
      - internal
    ports:
      - "9000:9000"
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TRUSTED_ORIGINS: portainer.domain.com
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.portainer.rule=Host(`portainer.domain.com`)"
        - "traefik.http.routers.portainer.entrypoints=web"
        - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  portainer_agent:
    image: portainer/agent:latest
    networks:
      - internal
    volumes:
      - /:/host
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AGENT_CLUSTER_ADDR: tasks.portainer_agent
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]
      restart_policy:
        condition: any

volumes:
  portainer_data:

networks:
  public:
    name: public
    external: true

  internal:
    name: internal
    external: true
